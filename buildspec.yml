version: 0.2

phases:
  install:
    runtime-versions:
      docker: 20

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - REPOSITORY_URI=573371913821.dkr.ecr.us-east-1.amazonaws.com/cicd-docker-repo
      - IMAGE_TAG=latest
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $REPOSITORY_URI

  build:
    commands:
      - echo Build started
      - docker build -t cicd-docker-repo .
      - docker tag cicd-docker-repo:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing image
      - docker push $REPOSITORY_URI:$IMAGE_TAG
